<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
  <rect width="900" height="650" fill="#bc4d65"/>
  <circle cx="450" cy="325" r="265" fill="#fff"/>

  <g transform="translate(-13 4)">
    <!-- prompt, as shown at the top of the app -->
    <text x="463" y="198" text-anchor="middle" fill="#13110f" font-family="Arial, sans-serif" font-size="27" font-weight="700">get the raw value of: name</text>

    <!-- question card -->
    <rect x="250" y="253" width="230" height="210" rx="16" fill="#13110f"/>
    <rect x="242" y="245" width="230" height="210" rx="16" fill="#d3d3d3" stroke="#13110f" stroke-width="7"/>
    <rect x="371" y="289" width="71" height="34" rx="8" fill="#f19c2e"/>
    <g fill="#13110f" font-family="DejaVu Sans Mono, monospace" font-size="20" font-weight="700">
      <text x="256" y="282">{</text>
      <text x="280" y="313">"name": "Ada",</text>
      <text x="280" y="350">"age": 36,</text>
      <text x="280" y="387">"city": "Rome"</text>
      <text x="256" y="424">}</text>
    </g>

    <!-- the app's => arrow -->
    <g fill="none" stroke="#13110f" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
      <path d="M496 337h26M496 361h26"/>
      <path d="M534 326l22 23-22 23"/>
    </g>

    <!-- answer card -->
    <rect x="588" y="322" width="96" height="70" rx="14" fill="#13110f"/>
    <rect x="580" y="314" width="96" height="70" rx="14" fill="#d3d3d3" stroke="#13110f" stroke-width="7"/>
    <rect x="595" y="330" width="66" height="38" rx="8" fill="#f19c2e"/>
    <text x="628" y="359" text-anchor="middle" fill="#13110f" font-family="DejaVu Sans Mono, monospace" font-size="27" font-weight="700">Ada</text>
  </g>
</svg>
